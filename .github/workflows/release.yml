name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (v0.5.0)'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate and test
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -f "changelog/${VERSION#v}.md" || { echo "changelog/${VERSION#v}.md is missing; add the release notes before tagging"; exit 1; }
          make test
          make bench-check
          node --check internal/server/assets/app.js
          node --test scripts/test-i18n.cjs scripts/test-activity.cjs
          bash -n scripts/sign-macos.sh scripts/notarize-macos.sh
          sh -n scripts/package-macos.sh scripts/release.sh website/public/install.sh
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Developer ID signing and Apple notarization
        if: steps.existing.outputs.exists != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib,re,secrets,shlex,subprocess
          required=['MACOS_CERTIFICATE_P12_BASE64','MACOS_CERTIFICATE_PASSWORD','APPLE_NOTARY_KEY_BASE64','NOTARY_KEY_ID','NOTARY_ISSUER_ID']
          for name in required:
              if not os.environ.get(name): raise SystemExit(f'{name} is required; unsigned releases are disabled')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          cert=root/'readyrig-signing.p12'
          key=root/'readyrig-notary.p8'
          keychain=root/'readyrig-signing.keychain-db'
          for path,name in [(cert,'MACOS_CERTIFICATE_P12_BASE64'),(key,'APPLE_NOTARY_KEY_BASE64')]:
              path.write_bytes(base64.b64decode(os.environ[name],validate=True))
              path.chmod(0o600)
          password=secrets.token_urlsafe(40)
          print(f'::add-mask::{password}')
          existing=shlex.split(subprocess.check_output(['security','list-keychains','-d','user'],text=True))
          commands=[['security','create-keychain','-p',password,str(keychain)],['security','set-keychain-settings','-lut','7200',str(keychain)],['security','unlock-keychain','-p',password,str(keychain)],['security','import',str(cert),'-k',str(keychain),'-P',os.environ['MACOS_CERTIFICATE_PASSWORD'],'-T','/usr/bin/codesign','-T','/usr/bin/security'],['security','set-key-partition-list','-S','apple-tool:,apple:,codesign:','-s','-k',password,str(keychain)],['security','list-keychains','-d','user','-s',str(keychain),*existing]]
          for command in commands:
              result=subprocess.run(command,capture_output=True,text=True)
              if result.returncode: raise SystemExit(f'Failed to prepare signing keychain at {command[1]}')
          identities=subprocess.check_output(['security','find-identity','-v','-p','codesigning',str(keychain)],text=True)
          match=re.search(r'([A-F0-9]{40}) "Developer ID Application:[^"]+"',identities)
          if not match: raise SystemExit('No valid Developer ID Application identity found')
          # Verify real signing before spending time building every release target.
          probe=root/'readyrig-signing-probe'
          result=subprocess.run(['cc','-x','c','-o',str(probe),'-'],input='int main(void) { return 0; }',capture_output=True,text=True)
          if result.returncode: raise SystemExit('Failed to compile the signing probe')
          try:
              env=dict(os.environ,SIGN_IDENTITY=match[1],SIGN_KEYCHAIN=str(keychain),REQUIRE_DEVELOPER_ID='1')
              result=subprocess.run(['bash','scripts/sign-macos.sh',str(probe),'dev.local.relay.signing-probe'],env=env,capture_output=True,text=True)
              if result.returncode: raise SystemExit('Developer ID signing preflight failed: '+result.stderr)
          finally:
              probe.unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for name,value in [('SIGN_IDENTITY',match[1]),('SIGN_KEYCHAIN',str(keychain)),('NOTARY_KEY_PATH',str(key)),('NOTARY_KEY_ID',os.environ['NOTARY_KEY_ID']),('NOTARY_ISSUER_ID',os.environ['NOTARY_ISSUER_ID'])]:
                  if '\n' in value or '\r' in value: raise SystemExit(f'Invalid {name}')
                  f.write(f'{name}={value}\n')
          PY
      - name: Build release assets
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: sh scripts/release.sh
      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$VERSION" "dist/releases/${VERSION#v}/"* --verify-tag --generate-notes --title "ReadyRig ${VERSION#v}"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/readyrig-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/readyrig-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/readyrig-signing.p12" "$RUNNER_TEMP/readyrig-notary.p8"
